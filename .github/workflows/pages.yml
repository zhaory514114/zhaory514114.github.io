steps:
  - uses: actions/checkout@v4

  - name: Use Node.js 22
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Install pnpm
    uses: pnpm/action-setup@v4
    with:
      version: '11.19.0'

  - name: Install dependencies
    run: pnpm install --frozen-lockfile

  - name: Build
    run: pnpm run build

  - name: Upload website
    uses: actions/upload-pages-artifact@v3
    with:
      path: ./public
